<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taller GitHub Actions · Tareas</title>
  <style>
    :root { --bg:#f7f7f5; --card:#fff; --ink:#1d1d1b; --muted:#6b6b66; --accent:#2f6fde; --ok:#1f8a4c; }
    @media (prefers-color-scheme: dark) { :root { --bg:#161615; --card:#222220; --ink:#ededea; --muted:#a3a39d; --accent:#7aa7ff; --ok:#5cc98a; } }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
    main { max-width:640px; margin:40px auto; padding:0 16px; }
    .card { background:var(--card); border-radius:12px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:16px; }
    h1 { font-size:1.5rem; margin:0 0 4px; }
    .muted { color:var(--muted); font-size:.9rem; }
    ul { list-style:none; padding:0; margin:0; }
    li { padding:8px 0; border-bottom:1px solid rgba(127,127,127,.15); }
    li.hecha { color:var(--muted); text-decoration:line-through; }
    form { display:flex; gap:8px; margin-top:12px; }
    input { flex:1; padding:8px 10px; border-radius:8px; border:1px solid rgba(127,127,127,.4); background:transparent; color:inherit; }
    button { padding:8px 14px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:.8rem; background:rgba(127,127,127,.15); }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>Tareas del taller de Diego</h1>
    <div class="muted">Frontend desplegado con GitHub Pages · build <span class="badge" id="build">__BUILD_SHA__</span></div>
    <div class="muted" id="modo"></div>
  </div>
  <div class="card">
    <ul id="lista"></ul>
    <form id="form">
      <input id="titulo" placeholder="Nueva tarea" required>
      <button>Agregar</button>
    </form>
  </div>
</main>
<script>
  // Si defines la variable API_URL en el repo, el workflow la inyecta aquí.
  const API_URL = '__API_URL__'.startsWith('__') ? '' : '__API_URL__';
  const demo = [
    { id: 1, titulo: 'Crear el primer workflow', hecha: true },
    { id: 2, titulo: 'Publicar la imagen en GHCR', hecha: false },
  ];
  const lista = document.getElementById('lista');
  document.getElementById('modo').textContent = API_URL
    ? 'Conectado a la API: ' + API_URL
    : 'Modo demo (sin API conectada): los datos viven en el navegador';

  function pintar(tareas) {
    lista.innerHTML = '';
    tareas.forEach(t => {
      const li = document.createElement('li');
      li.textContent = t.titulo;
      if (t.hecha) li.className = 'hecha';
      lista.appendChild(li);
    });
  }
  async function cargar() {
    if (!API_URL) return pintar(demo);
    lista.innerHTML = '<li class="muted">Cargando… el servidor gratuito puede tardar ~1 min en despertar</li>';
    try {
      const v = await (await fetch(API_URL + '/api/version')).json();
      document.getElementById('modo').textContent =
        'Conectado a la API: ' + API_URL + ' · versión ' + v.version + ' · commit ' + v.commit.slice(0, 7);
      const r = await fetch(API_URL + '/api/tareas');
      pintar(await r.json());
    } catch (err) {
      lista.innerHTML = '<li class="muted">No se pudo contactar la API. Recarga en unos segundos.</li>';
    }
  }
  document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    const titulo = document.getElementById('titulo').value.trim();
    if (!titulo) return;
    if (API_URL) {
      await fetch(API_URL + '/api/tareas', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ titulo }) });
    } else {
      demo.push({ id: demo.length + 1, titulo, hecha: false });
    }
    e.target.reset();
    cargar();
  });
  cargar();
</script>
</body>
</html>
