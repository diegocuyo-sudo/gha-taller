name: Frontend → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write          # publicar en Pages
  id-token: write       # OIDC: Pages verifica que el deploy viene de este repo

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6

      - name: Inyectar commit y URL de la API
        env:
          API_URL: ${{ vars.API_URL || vars.RENDER_URL }}
        run: |
          sed -i "s|__BUILD_SHA__|${GITHUB_SHA::7}|" public/index.html
          if [ -n "$API_URL" ]; then
            sed -i "s|__API_URL__|${API_URL}|g" public/index.html
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v5
