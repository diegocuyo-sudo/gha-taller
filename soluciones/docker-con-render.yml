name: Docker → GHCR

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write       # necesario para publicar en ghcr.io

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/gha-taller-api

jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Login a GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calcular tags y labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build (sin publicar) para smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: gha-taller-api:test
          build-args: |
            APP_VERSION=main
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test del contenedor
        run: |
          docker run -d --name api -p 3000:3000 gha-taller-api:test
          for i in $(seq 1 10); do
            curl -fsS http://localhost:3000/health && exit 0
            sleep 1
          done
          echo "La API no respondió" && docker logs api && exit 1

      - name: Build y push a GHCR
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=main
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha

  deploy:
    needs: build-push
    if: vars.RENDER_URL != ''          # se activa cuando configuras Render (Paso 4b)
    uses: ./.github/workflows/deploy-render.yml
    with:
      image-digest: ${{ needs.build-push.outputs.digest }}
      expected-version: main
      environment: dev
    secrets: inherit
